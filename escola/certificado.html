<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificado de Programador(a) Mirim</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,6 62,38 96,38 68,58 79,92 50,72 21,92 32,58 4,38 38,38' fill='%23ffd84d' stroke='%23e0a800' stroke-width='5'/></svg>">
<style>
  :root {
    --sky: #e8f4ff;
    --ink: #1d2a44;
    --cell-line: #b9d3ee;
    --key: #ffd84d;
    --play: #3cc26b;
    --now: #4da3ff;
  }
  * { box-sizing: border-box }
  body {
    margin: 0;
    padding: 24px 16px 40px;
    background: var(--sky);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  /* Form for the teacher, shown only on screen */
  .form { max-width: 900px; margin: 0 auto 28px; padding: 20px 22px; background: #fff; border: 4px solid var(--ink); border-radius: 24px }
  .form h1 { margin: 0 0 6px; font-size: min(34px, 7vw); font-weight: 900 }
  .form p { margin: 0 0 16px; font-size: 17px; font-weight: 600; line-height: 1.45 }
  .form label { display: block; margin-bottom: 14px; font-size: 17px; font-weight: 800 }
  .form textarea, .form input { display: block; width: 100%; margin-top: 6px; padding: 10px 12px; border: 3px solid var(--cell-line); border-radius: 12px; font: 600 18px system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink) }
  .form textarea { height: 150px; resize: vertical }
  .form .row { display: flex; gap: 14px; flex-wrap: wrap }
  .form .row label { flex: 1; min-width: 200px }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center }
  .form button { border: none; border-radius: 16px; padding: 12px 28px; background: var(--play); color: #fff; font-size: 22px; font-weight: 900; box-shadow: 0 5px 0 #1f7a41; cursor: pointer }
  .form button:active { transform: translateY(3px); box-shadow: 0 2px 0 #1f7a41 }
  .form button:disabled { opacity: .6; cursor: wait }
  #pdf { background: var(--now); box-shadow: 0 5px 0 #2f7fd6 }
  #pdf:active { box-shadow: 0 2px 0 #2f7fd6 }
  #count { font-size: 17px; font-weight: 700 }

  /* Showing each certificate as one picture, the same one that is printed and put in the PDF */
  .cert { display: block; width: min(100%, 297mm); margin: 0 auto 28px; box-shadow: 0 8px 0 var(--cell-line) }

  /* Printing one certificate per A4 sheet, landscape, without the form */
  @page { size: A4 landscape; margin: 0 }
  @media print {
    body { padding: 0; background: #fff }
    .form { display: none }
    .cert { width: 297mm; height: 210mm; margin: 0; box-shadow: none; break-after: page; page-break-after: always }
    .cert:last-child { break-after: auto; page-break-after: auto }
  }
</style>
</head>
<body>

<section class="form">
  <h1>🏅 Certificado de Programador(a) Mirim</h1>
  <p>Escreva o nome das crianças, um por linha. Depois imprima, ou baixe um PDF com um certificado por criança, cada um numa folha A4 deitada. Deixe os nomes em branco para sair um certificado com a linha vazia, para preencher à mão.</p>
  <label>Nomes das crianças
    <textarea id="names" placeholder="Ana Clara&#10;Pedro&#10;Maria Eduarda"></textarea>
  </label>
  <div class="row">
    <label>Escola <input id="school" placeholder="Nome da escola"></label>
    <label>Data <input id="date" placeholder="dd/mm/aaaa"></label>
  </div>
  <div class="actions">
    <button type="button" onclick="print()">🖨️ Imprimir</button>
    <button type="button" id="pdf">📄 Baixar PDF</button>
    <span id="count"></span>
  </div>
</section>

<main id="certificates"></main>

<script>
// Measuring the certificate in tenths of a millimetre, the size of a landscape A4 sheet
const WIDTH = 2970, HEIGHT = 2100

// Sizing the PDF pages at 200 dots per inch, sharp on paper and light enough for a whole class
const PIXELS = [2339, 1654]

const SYMBOLS = `
  <symbol id="bot" viewBox="0 0 100 100">
    <line x1="50" y1="8" x2="50" y2="22" stroke="#1d2a44" stroke-width="4"/>
    <circle cx="50" cy="8" r="6" fill="#ff4d4d"/>
    <rect x="18" y="22" width="64" height="48" rx="14" fill="#4da3ff" stroke="#1d2a44" stroke-width="4"/>
    <circle cx="38" cy="44" r="9" fill="#fff"/><circle cx="62" cy="44" r="9" fill="#fff"/>
    <circle cx="40" cy="45" r="4" fill="#1d2a44"/><circle cx="64" cy="45" r="4" fill="#1d2a44"/>
    <path d="M40 60 q10 7 20 0" stroke="#1d2a44" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="30" y="72" width="40" height="20" rx="6" fill="#8cc4ff" stroke="#1d2a44" stroke-width="4"/>
  </symbol>
  <symbol id="star" viewBox="0 0 100 100">
    <polygon points="50,6 62,38 96,38 68,58 79,92 50,72 21,92 32,58 4,38 38,38" fill="#ffd84d" stroke="#e0a800" stroke-width="5" stroke-linejoin="round"/>
  </symbol>
  <symbol id="medal" viewBox="0 0 100 100">
    <path d="M30 4 H48 L58 40 H40 Z" fill="#4da3ff" stroke="#1d2a44" stroke-width="5" stroke-linejoin="round"/>
    <path d="M70 4 H52 L42 40 H60 Z" fill="#ff4d4d" stroke="#1d2a44" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="50" cy="66" r="28" fill="#ffd84d" stroke="#1d2a44" stroke-width="5"/>
    <polygon points="50,50 55,61 67,62 58,70 61,82 50,75 39,82 42,70 33,62 45,61" fill="#e0a800"/>
  </symbol>
  <symbol id="bug" viewBox="0 0 100 100">
    <path d="M26 54 10 46M24 67 8 70M29 81 17 93M74 54 90 46M76 67 92 70M71 81 83 93M43 18 35 6M57 18 65 6" stroke="#1d2a44" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="35" cy="6" r="5" fill="#ff4d4d" stroke="#1d2a44" stroke-width="3"/><circle cx="65" cy="6" r="5" fill="#ff4d4d" stroke="#1d2a44" stroke-width="3"/>
    <ellipse cx="50" cy="64" rx="30" ry="29" fill="#ff4d4d" stroke="#1d2a44" stroke-width="5"/>
    <path d="M50 40V91" stroke="#b52a2a" stroke-width="4"/>
    <circle cx="38" cy="58" r="6" fill="#b52a2a"/><circle cx="63" cy="56" r="5" fill="#b52a2a"/><circle cx="62" cy="78" r="6" fill="#b52a2a"/><circle cx="38" cy="79" r="4" fill="#b52a2a"/>
    <circle cx="50" cy="30" r="17" fill="#1d2a44"/>
    <circle cx="43" cy="29" r="6.5" fill="#fff"/><circle cx="57" cy="29" r="6.5" fill="#fff"/>
    <circle cx="44" cy="30" r="3" fill="#1d2a44"/><circle cx="58" cy="30" r="3" fill="#1d2a44"/>
    <path d="M45 39q5 4 10 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
  </symbol>
  <symbol id="cellphone" viewBox="0 0 100 100">
    <rect x="26" y="6" width="48" height="88" rx="10" fill="#fff" stroke="#1d2a44" stroke-width="5"/>
    <rect x="33" y="16" width="34" height="58" rx="4" fill="#8cc4ff"/>
    <circle cx="57" cy="30" r="7" fill="#ffd84d"/>
    <path d="M33 74 V58 Q42 46 50 56 Q58 48 67 58 V74 Z" fill="#3cc26b"/>
    <circle cx="50" cy="84" r="4" fill="#1d2a44"/>
  </symbol>
  <symbol id="server" viewBox="0 0 100 100">
    <rect x="18" y="8" width="64" height="84" rx="10" fill="#ff9a3c" stroke="#1d2a44" stroke-width="5"/>
    <rect x="28" y="20" width="44" height="15" rx="4" fill="#fff" stroke="#1d2a44" stroke-width="4"/>
    <rect x="28" y="43" width="44" height="15" rx="4" fill="#fff" stroke="#1d2a44" stroke-width="4"/>
    <rect x="28" y="66" width="44" height="15" rx="4" fill="#fff" stroke="#1d2a44" stroke-width="4"/>
    <circle cx="62" cy="27.5" r="4" fill="#3cc26b"/><circle cx="62" cy="50.5" r="4" fill="#3cc26b"/><circle cx="62" cy="73.5" r="4" fill="#3cc26b"/>
  </symbol>
  <symbol id="database" viewBox="0 0 100 100">
    <path d="M20 22 V78 A30 12 0 0 0 80 78 V22" fill="#ffd84d" stroke="#1d2a44" stroke-width="5"/>
    <path d="M20 41 A30 12 0 0 0 80 41 M20 60 A30 12 0 0 0 80 60" fill="none" stroke="#1d2a44" stroke-width="4"/>
    <ellipse cx="50" cy="22" rx="30" ry="12" fill="#ffe88a" stroke="#1d2a44" stroke-width="5"/>
  </symbol>`

// Pairing each skill with the drawing of the game that teaches it
const SKILLS = [
  ["montar um algoritmo", '<use href="#bot" x="0" y="10" width="62" height="62"/><use href="#star" x="50" y="40" width="48" height="48"/>'],
  ["caçar bugs", '<use href="#bug" x="12" y="12" width="76" height="76"/>'],
  ["programar em dupla", '<use href="#bot" x="0" y="20" width="56" height="56"/><use href="#bot" x="44" y="20" width="56" height="56"/>'],
  ["ligar um sistema", '<use href="#cellphone" x="0" y="22" width="40" height="56"/><use href="#server" x="30" y="14" width="44" height="72"/><use href="#database" x="62" y="26" width="38" height="48"/>'],
]

const FONT = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
const fields = ["names", "school", "date"].map(id => document.getElementById(id))
const escape = text => text.replace(/[&<>"]/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[character])

// Measuring texts with the same font the certificate uses, so long names and school names shrink just enough
const ruler = document.createElement("canvas").getContext("2d")
function measure(text, size, weight) {
  ruler.font = `${weight} ${size}px ${FONT}`
  return ruler.measureText(text).width
}
const fit = (text, size, width, weight) => Math.min(size, size * width / Math.max(1, measure(text, size, weight)))

// Drawing a whole certificate as one SVG, used for the preview, for printing and for the PDF
function certificate(name, school, date) {
  const text = (x, y, size, content, extra = "") => `<text x="${x}" y="${y}" font-size="${size}" ${extra}>${escape(content)}</text>`
  const skills = SKILLS.map(([label, drawing], index) => {
    const x = 660 + index * 550
    return `<circle cx="${x}" cy="1380" r="140" fill="#e8f4ff" stroke="#1d2a44" stroke-width="10"/>
      <svg x="${x - 105}" y="1275" width="210" height="210" viewBox="0 0 100 100">${drawing}</svg>
      ${text(x, 1590, 50, label, 'font-weight="800"')}`
  }).join("")

  // Sizing the yellow band around the medal and the subtitle, centred on the page
  const subtitle = "de Programador(a) Mirim", band = 60 + 120 + 30 + measure(subtitle, 92, 900) + 60, left = (WIDTH - band) / 2
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${WIDTH} ${HEIGHT}" width="${WIDTH}" height="${HEIGHT}"
    font-family="${FONT}" font-weight="700" fill="#1d2a44" text-anchor="middle">
    <defs>${SYMBOLS}</defs>
    <rect width="${WIDTH}" height="${HEIGHT}" fill="#4da3ff"/>
    <rect x="65" y="65" width="2840" height="1970" rx="90" fill="#fff" stroke="#1d2a44" stroke-width="21"/>
    <use href="#star" x="110" y="110" width="210" height="210" transform="rotate(-14 215 215)"/>
    <use href="#star" x="2650" y="110" width="210" height="210" transform="rotate(14 2755 215)"/>
    <use href="#bot" x="2470" y="1560" width="330" height="330"/>
    ${text(1485, 470, 220, "CERTIFICADO", 'font-weight="900" letter-spacing="13"')}
    <rect x="${left}" y="540" width="${band}" height="150" rx="75" fill="#ffd84d"/>
    <use href="#medal" x="${left + 60}" y="555" width="120" height="120"/>
    ${text(left + 210, 645, 92, subtitle, 'font-weight="900" text-anchor="start"')}
    ${text(1485, 830, 66, "Certificamos que")}
    ${text(1485, 1010, fit(name, 150, 1850, 900), name, 'font-weight="900"')}
    <line x1="560" y1="1060" x2="2410" y2="1060" stroke="#1d2a44" stroke-width="12" stroke-dasharray="34 22"/>
    ${text(1485, 1190, 63, "aprendeu como se faz um programa de computador e já sabe:")}
    ${skills}
    ${text(250, 1790, 50, "Escola:", 'text-anchor="start"')}
    <line x1="440" y1="1800" x2="1400" y2="1800" stroke="#1d2a44" stroke-width="7"/>
    ${text(460, 1780, fit(school, 50, 920, 800), school, 'text-anchor="start" font-weight="800"')}
    ${text(250, 1910, 50, "Data:", 'text-anchor="start"')}
    <line x1="400" y1="1920" x2="1400" y2="1920" stroke="#1d2a44" stroke-width="7"/>
    ${text(420, 1900, fit(date, 50, 960, 800), date, 'text-anchor="start" font-weight="800"')}
    <line x1="1580" y1="1830" x2="2300" y2="1830" stroke="#1d2a44" stroke-width="7"/>
    ${text(1940, 1900, 50, "Quem apresentou os jogos")}
    ${text(1485, 2005, 43, "Curso de Engenharia de Software · UNIPAMPA · Campus Alegrete", 'fill="#4a5a78"')}
  </svg>`
}

const pictureOf = svg => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg)
const typedNames = () => fields[0].value.split("\n").map(name => name.trim()).filter(Boolean)

// Drawing one certificate per name, or a single blank one when no name was typed
function render() {
  const names = typedNames()
  document.getElementById("certificates").replaceChildren(...(names.length ? names : [""]).map(name => {
    const image = new Image()
    image.className = "cert"
    image.alt = name ? `Certificado de ${name}` : "Certificado em branco"
    image.src = pictureOf(certificate(name, fields[1].value.trim(), fields[2].value.trim()))
    return image
  }))
  document.getElementById("count").textContent = names.length
    ? `${names.length} ${names.length === 1 ? "certificado" : "certificados"}`
    : "1 certificado em branco"
}

// Writing a PDF by hand with one JPEG per page, so the file downloads without any library or internet
function buildPdf(pages, [width, height]) {
  const encoder = new TextEncoder(), parts = [], offsets = []
  let size = 0
  const add = part => {
    const bytes = typeof part === "string" ? encoder.encode(part) : part
    parts.push(bytes)
    size += bytes.length
  }
  const open = id => {
    offsets[id] = size
    add(`${id} 0 obj\n`)
  }
  const draw = "q 841.89 0 0 595.28 0 0 cm /Im0 Do Q"
  const pageIds = pages.map((_, index) => 3 + index * 3)
  add("%PDF-1.4\n%âãÏÓ\n")
  open(1)
  add("<< /Type /Catalog /Pages 2 0 R >>\nendobj\n")
  open(2)
  add(`<< /Type /Pages /Kids [${pageIds.map(id => `${id} 0 R`).join(" ")}] /Count ${pages.length} >>\nendobj\n`)
  pages.forEach((jpeg, index) => {
    const page = pageIds[index]
    open(page)
    add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 841.89 595.28] /Resources << /XObject << /Im0 ${page + 2} 0 R >> >> /Contents ${page + 1} 0 R >>\nendobj\n`)
    open(page + 1)
    add(`<< /Length ${draw.length} >>\nstream\n${draw}\nendstream\nendobj\n`)
    open(page + 2)
    add(`<< /Type /XObject /Subtype /Image /Width ${width} /Height ${height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`)
    add(jpeg)
    add("\nendstream\nendobj\n")
  })
  const table = size, count = offsets.length
  add(`xref\n0 ${count}\n0000000000 65535 f \n${offsets.slice(1).map(offset => `${String(offset).padStart(10, "0")} 00000 n \n`).join("")}`)
  add(`trailer\n<< /Size ${count} /Root 1 0 R >>\nstartxref\n${table}\n%%EOF\n`)
  return new Blob(parts, { type: "application/pdf" })
}

// Painting every certificate on a canvas and turning it into a JPEG page
async function makePdf() {
  const canvas = document.createElement("canvas")
  ;[canvas.width, canvas.height] = PIXELS
  const context = canvas.getContext("2d")
  const pages = []
  for (const image of document.querySelectorAll("#certificates .cert")) {
    await image.decode()
    context.fillStyle = "#fff"
    context.fillRect(0, 0, canvas.width, canvas.height)
    context.drawImage(image, 0, 0, canvas.width, canvas.height)
    const jpeg = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.9))
    pages.push(new Uint8Array(await jpeg.arrayBuffer()))
  }
  return buildPdf(pages, PIXELS)
}

// Naming the file after the child when there is only one certificate
function fileName() {
  const names = typedNames()
  if (names.length !== 1) return names.length ? "certificados.pdf" : "certificado-em-branco.pdf"
  return "certificado-" + names[0].normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/gi, "-").replace(/^-|-$/g, "").toLowerCase() + ".pdf"
}

async function downloadPdf() {
  const button = document.getElementById("pdf")
  button.disabled = true
  button.textContent = "⏳ Gerando..."
  try {
    const link = document.createElement("a")
    link.href = URL.createObjectURL(await makePdf())
    link.download = fileName()
    link.click()
    setTimeout(() => URL.revokeObjectURL(link.href), 60000)
  } finally {
    button.disabled = false
    button.textContent = "📄 Baixar PDF"
  }
}

fields.forEach(field => field.addEventListener("input", render))
document.getElementById("pdf").addEventListener("click", downloadPdf)
render()
</script>
</body>
</html>
